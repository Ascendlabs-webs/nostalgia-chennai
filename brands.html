<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brands — Nostalgia Chennai</title>
<meta name="description" content="Discover every brand at Nostalgia Chennai, from Marvel Legends and DC Multiverse to Hot Wheels and Bandai.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>N</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div data-header></div>
<main>
  <div class="page-hero"><div class="wrap">
    <div class="crumbs"><a href="index.html">Home</a> / Brands</div>
    <div class="eyebrow">Every label we carry</div>
    <h1>Brands</h1>
    <p>An alphabetical directory of the makers behind the shelf.</p>
  </div></div>
  <section style="padding-top:56px"><div class="wrap"><div class="brand-grid" id="bgrid"></div></div></section>
</main>
<div data-footer></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  var g = document.getElementById("bgrid");
  var brands = NC.brands().slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var LOGOS = {
    "hot-wheels": '<span class="wm wm-hw">HOT WHEELS</span>',
    "topps": '<span class="wm wm-topps">Topps</span>',
    "wwe": '<span class="wm wm-wwe">WWE</span>',
    "lego": '<span class="wm wm-lego">LEGO</span>',
    "harry-potter": '<span class="wm wm-hp">Harry Potter</span>',
    "dc-comics": '<span class="wm wm-dc">DC COMICS</span>',
    "majorette": '<span class="wm wm-maj">Majorette</span>',
    "mcdonalds": '<span class="wm wm-mcd">M</span>'
  };
  var TILES = [
    {slug:"hot-wheels", name:"Hot Wheels", logo:"assets/img/brands/hot-wheels.png", href:"brand.html?b=hot-wheels"},
    {slug:"topps", name:"Topps", logo:"assets/img/brands/topps.png", href:"brand.html?b=topps"},
    {slug:"wwe", name:"WWE", logo:"assets/img/brands/wwe.png", href:"brand.html?b=wwe"},
    {slug:"lego", name:"Lego", logo:"assets/img/brands/lego.png", href:"brand.html?b=lego"},
    {slug:"harry-potter", name:"Harry Potter", logo:"assets/img/brands/harry-potter.png", href:"brand.html?b=harry-potter"},
    {slug:"dc-comics", name:"DC Comics", logo:"assets/img/brands/dc-comics.png", href:"brand.html?b=dc-comics"},
    {slug:"majorette", name:"Majorette", logo:"assets/img/brands/majorette.png", href:"brand.html?b=majorette"},
    {slug:"mcdonalds", name:"McDonald's", logo:"assets/img/brands/mcdonalds.svg", href:"brand.html?b=mcdonalds"},
    {slug:"nerf", name:"Nerf", logo:"assets/img/brands/nerf.png", href:"brand.html?b=nerf"},
    {slug:"power-rangers", name:"Power Rangers", logo:"assets/img/brands/power-rangers.png", href:"brand.html?b=power-rangers"},
    {slug:"playstation", name:"PlayStation", logo:"assets/img/brands/playstation.jpg", href:"brand.html?b=playstation"},
    {slug:"toy-story", name:"Toy Story", logo:"assets/img/brands/toy-story.jpg", href:"brand.html?b=toy-story"},
    {slug:"funko", name:"Funko", logo:"assets/img/brands/funko.png", href:"brand.html?b=funko"},
    {slug:"marvel", name:"Marvel", logo:"assets/img/brands/marvel.png", href:"marvel.html"},
    {slug:"star-wars", name:"Star Wars", logo:"assets/img/brands/star-wars.png", href:"collection.html?c=star-wars"},
    {slug:"barbie", name:"Barbie", logo:"assets/img/brands/barbie.png", href:"brand.html?b=barbie"}
  ];
  function tileCount(t){
    var k = t.slug.split("-")[0];
    return NC.products().filter(function(p){
      return p.brand.toLowerCase().indexOf(k) > -1 || p.franchise.toLowerCase().indexOf(k) > -1;
    }).length;
  }
  g.innerHTML = TILES.map(function(t){
    var n = tileCount(t);
    var mark = t.logo
      ? '<img src="'+t.logo+'" alt="'+t.name+' logo" loading="lazy" onerror="this.outerHTML='+ "'" + t.name.charAt(0) + "'" + '">'
      : t.name.charAt(0);
    return '<a class="brand-card reveal" href="'+t.href+'"><div class="logo">'+mark+'</div><strong>'+t.name+'</strong><p>'+(n?n+" piece"+(n===1?"":"s"):"Explore the label")+'</p></a>';
  }).join("");
  NC.bindCards(g);
})();
</script>
</body>
</html>
